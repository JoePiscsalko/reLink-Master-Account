# reLink360 Account Master — static site, no build step
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# JSON data: revalidate every load so a data refresh goes live immediately
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/master"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/report"
  to = "/report.html"
  status = 200
